<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Driver ↔ Admin Live Location Test</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Socket.IO client -->
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    body {
      font-family: "Inter", system-ui, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f4f6f9;
      color: #111827;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 6px;
    }

    .wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 18px;
    }

    @media (max-width: 900px) {
      .wrap {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      border: 1px solid #eef1f5;
    }

    h2 {
      margin: 0 0 14px 0;
      font-size: 17px;
      font-weight: 600;
      color: #1f2937;
    }

    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      transition: 0.2s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    button.secondary {
      background: #6b7280;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      margin-top: 4px;
      font-size: 14px;
    }

    input[type="number"] {
      width: 80px;
    }

    label {
      display: block;
      margin-top: 8px;
      font-size: 13px;
      color: #374151;
      font-weight: 500;
    }

    .controls {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    #map {
      height: 420px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }

    @media (max-width: 600px) {
      #map {
        height: 360px;
      }
    }

    .log {
      max-height: 420px;
      overflow-y: auto;
      margin-top: 8px;
      font-size: 13px;
      background: #fdfdff;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      line-height: 1.4;
    }

    .log div {
      padding: 4px 0;
      border-bottom: 1px dashed #e5e7eb;
    }

    .log div:last-child {
      border-bottom: none;
    }

  </style>
</head>

<body>

  <h1>Live Location Tester — Driver & Admin</h1>
  <p style="color:#6b7280">Use this page in 2 tabs: one as Driver and one as Admin.</p>

  <div class="wrap">

    <!-- DRIVER PANEL -->
    <div class="card">
      <h2>Driver — Send Live Location</h2>

      <label>Driver ID</label>
      <input id="driverId" type="text" value="driver-1" />

      <div class="controls">
        <button id="sendOnceBtn">Send Once</button>
        <button id="startAutoBtn" class="secondary">Start Auto</button>
        <button id="stopAutoBtn" class="secondary" disabled>Stop</button>

        <label style="margin-left: 6px;">
          Interval (s)
          <input id="intervalSec" type="number" value="5" min="1" />
        </label>
      </div>

      <small style="display:block;margin-top:14px;color:#374151;font-weight:600;">Driver Logs</small>
      <div id="driverLog" class="log"></div>
    </div>

    <!-- ADMIN PANEL -->
    <div class="card">
      <h2>Admin — Live Map</h2>

      <div id="map"></div>

      <small style="display:block;margin-top:14px;color:#374151;font-weight:600;">Socket Events</small>
      <div id="adminLog" class="log"></div>
    </div>

  </div>

  <!-- ============================== -->
  <!-- JAVASCRIPT FUNCTIONALITY       -->
  <!-- ============================== -->

  <script>
    // ====== CONFIG ======
    const BACKEND = "https://giro-api.demohub.tech";
    const API_LOCATION = BACKEND + "/api/location";
    const SOCKET_URL = BACKEND;

    // ===== DRIVER PANEL =====
    const driverLogEl = document.getElementById("driverLog");
    const sendOnceBtn = document.getElementById("sendOnceBtn");
    const startAutoBtn = document.getElementById("startAutoBtn");
    const stopAutoBtn = document.getElementById("stopAutoBtn");
    const intervalSecInput = document.getElementById("intervalSec");
    const driverIdInput = document.getElementById("driverId");

    let autoIntervalId = null;

    function logDriver(text) {
      const time = new Date().toLocaleTimeString();
      driverLogEl.innerHTML = `<div>[${time}] ${text}</div>` + driverLogEl.innerHTML;
    }

    async function getCurrentPos() {
      return new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true
        });
      });
    }

    async function sendLocationOnce() {
      try {
        const pos = await getCurrentPos();
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const driverId = driverIdInput.value || "driver-1";

        logDriver(`Captured ${lat.toFixed(5)}, ${lng.toFixed(5)} — sending...`);

        const res = await fetch(API_LOCATION, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ driverId, lat, lng })
        });

        const body = await res.json();
        logDriver(body.msg || "Sent.");
      } catch (err) {
        logDriver("Error: " + err.message);
      }
    }

    sendOnceBtn.onclick = sendLocationOnce;

    startAutoBtn.onclick = () => {
      const sec = Math.max(1, Number(intervalSecInput.value || 5));
      startAutoBtn.disabled = true;
      stopAutoBtn.disabled = false;
      logDriver(`Auto mode ON (${sec}s)`);

      sendLocationOnce();
      autoIntervalId = setInterval(sendLocationOnce, sec * 1000);
    };

    stopAutoBtn.onclick = () => {
      clearInterval(autoIntervalId);
      autoIntervalId = null;
      startAutoBtn.disabled = false;
      stopAutoBtn.disabled = true;
      logDriver("Auto mode OFF");
    };

    // ===== ADMIN MAP =====
    const adminLogEl = document.getElementById("adminLog");

    function logAdmin(text) {
      const time = new Date().toLocaleTimeString();
      adminLogEl.innerHTML = `<div>[${time}] ${text}</div>` + adminLogEl.innerHTML;
    }

    // Map Init
    const map = L.map("map", {
      center: [20.5937, 78.9629],
      zoom: 5
    });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19
    }).addTo(map);

    // Store markers by driver
    const markers = {};

    // Socket
    const socket = io(SOCKET_URL);

    socket.on("connect", () => logAdmin("Socket connected: " + socket.id));
    socket.on("disconnect", () => logAdmin("Socket disconnected"));

    socket.on("driver-location", (data) => {
      const { driverId, lat, lng, timestamp } = data;
      const time = new Date(timestamp).toLocaleTimeString();

      logAdmin(`Driver ${driverId} → ${lat}, ${lng}`);

      const pos = [Number(lat), Number(lng)];

      if (markers[driverId]) {
        markers[driverId].setLatLng(pos);
      } else {
        markers[driverId] = L.marker(pos).addTo(map);
      }

      markers[driverId].bindPopup(`<b>${driverId}</b><br>${lat}, ${lng}<br>${time}`);
    });

    setTimeout(() => map.invalidateSize(), 600);
  </script>

</body>
</html>
