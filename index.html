<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Driver ↔ Admin Live Location</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Socket.IO client -->
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    body {
      font-family: "Inter", system-ui, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f3f4f6;
      color: #111827;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    p.subtitle {
      margin: 0 0 18px 0;
      font-size: 14px;
      color: #6b7280;
    }

    .wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    @media (max-width: 900px) {
      .wrap {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 20px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      transition: 0.2s ease;
    }

    .card:hover {
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    h2 {
      margin: 0 0 16px 0;
      font-size: 18px;
      font-weight: 600;
      color: #111827;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }

    input:focus {
      border-color: #2563eb;
      background: #ffffff;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
      align-items: center;
    }

    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-size: 14px;
      font-weight: 500;
      transition: 0.2s ease;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    button.secondary {
      background: #6b7280;
    }

    #map {
      height: 450px;
      width: 100%;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      overflow: hidden;
    }

    @media (max-width: 600px) {
      #map { height: 380px; }
    }

    .log-title {
      margin-top: 18px;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 700;
      color: #374151;
    }

    .log {
      max-height: 450px;
      overflow-y: auto;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      line-height: 1.45;
    }

    .log div {
      padding: 6px 0;
      border-bottom: 1px dashed #e5e7eb;
    }

    .log div:last-child {
      border-bottom: none;
    }
  </style>
</head>

<body>
  <h1>Live Location Tester</h1>
  <p class="subtitle">Use two tabs: one as Driver, one as Admin. All panels are on the same page too.</p>

  <div class="wrap">
    <!-- DRIVER PANEL -->
    <div class="card">
      <h2>Driver — Send Location</h2>

      <label>Driver ID</label>
      <input id="driverId" type="text" value="driver-1">

      <div class="controls">
        <button id="sendOnceBtn">Send Once</button>
        <button id="startAutoBtn" class="secondary">Start Auto</button>
        <button id="stopAutoBtn" class="secondary" disabled>Stop</button>

        <div>
          <label>Interval (s)</label>
          <input id="intervalSec" type="number" value="5" min="1" style="width:90px;">
        </div>
      </div>

      <div class="log-title">Driver Logs</div>
      <div id="driverLog" class="log"></div>
    </div>

    <!-- ADMIN PANEL -->
    <div class="card">
      <h2>Admin — Live Map & Logs</h2>
      <div id="map"></div>

      <div class="log-title">Socket Events</div>
      <div id="adminLog" class="log"></div>
    </div>
  </div>

  <script>
    const BACKEND = "https://giro-api.demohub.tech";
    const API_LOCATION = BACKEND + "/api/location";
    const SOCKET_URL = BACKEND;

    // DRIVER
    const driverLogEl = document.getElementById('driverLog');
    const sendOnceBtn = document.getElementById('sendOnceBtn');
    const startAutoBtn = document.getElementById('startAutoBtn');
    const stopAutoBtn = document.getElementById('stopAutoBtn');
    const intervalSecInput = document.getElementById('intervalSec');
    const driverIdInput = document.getElementById('driverId');
    let autoIntervalId = null;

    function logDriver(text) {
      const time = new Date().toLocaleTimeString();
      driverLogEl.innerHTML = `<div>[${time}] ${text}</div>` + driverLogEl.innerHTML;
    }

    async function getCurrentPositionPromise() {
      return new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy:true, maximumAge:0 });
      });
    }

    async function sendLocationOnce() {
      try {
        const pos = await getCurrentPositionPromise();
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const driverId = driverIdInput.value || "driver-1";

        logDriver(`Coords: ${lat.toFixed(6)}, ${lng.toFixed(6)} → sending...`);

        const res = await fetch(API_LOCATION, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ driverId, lat, lng })
        });

        const body = await res.json().catch(()=>({}));
        logDriver(res.ok ? `Sent ✔ (${body.msg||'ok'})` : `Failed: ${res.status}`);
      } catch(err) {
        logDriver("Error: " + err.message);
      }
    }

    sendOnceBtn.onclick = sendLocationOnce;

    startAutoBtn.onclick = () => {
      const sec = Math.max(1, Number(intervalSecInput.value)||5);
      startAutoBtn.disabled = true; stopAutoBtn.disabled = false;
      logDriver(`Auto-send every ${sec}s`);
      sendLocationOnce();
      autoIntervalId = setInterval(sendLocationOnce, sec*1000);
    };

    stopAutoBtn.onclick = () => {
      clearInterval(autoIntervalId);
      autoIntervalId = null;
      startAutoBtn.disabled = false; stopAutoBtn.disabled = true;
      logDriver('Auto-send stopped');
    };

    // ADMIN + MAP
    const adminLogEl = document.getElementById("adminLog");
    function logAdmin(text) {
      const time = new Date().toLocaleTimeString();
      adminLogEl.innerHTML = `<div>[${time}] ${text}</div>` + adminLogEl.innerHTML;
    }

    const map = L.map('map',{center:[20.5937,78.9629], zoom:5});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
    const markers = {};

    const socket = io(SOCKET_URL, {transports:['websocket']});
    socket.on('connect',()=>logAdmin(`Socket connected: ${socket.id}`));
    socket.on('disconnect',(r)=>logAdmin(`Socket disconnected: ${r}`));

    // 🔥 Corrected to match backend emit "driver-location-update"
    socket.on('driver-location-update',(data)=>{
      const { driverId='unknown', coords, timestamp } = data||{};
      if(!coords?.lat||!coords?.lng) return;
      const lat = Number(coords.lat), lng = Number(coords.lng);
      if(!isFinite(lat)||!isFinite(lng)) return;

      const t = timestamp ? new Date(timestamp).toLocaleTimeString() : new Date().toLocaleTimeString();
      logAdmin(`Driver ${driverId} → ${lat}, ${lng} @ ${t}`);

      if(markers[driverId]){
        markers[driverId].setLatLng([lat,lng]);
        markers[driverId].bindPopup(`${driverId}<br>${lat.toFixed(6)}, ${lng.toFixed(6)}<br>${t}`);
      } else {
        const m = L.marker([lat,lng]).addTo(map);
        m.bindPopup(`${driverId}<br>${lat.toFixed(6)}, ${lng.toFixed(6)}<br>${t}`);
        markers[driverId] = m;
      }
    });

    socket.on('connect_error',(err)=>logAdmin('connect_error: '+(err?.message||err)));
    setTimeout(()=>map.invalidateSize(),500);
  </script>
</body>
</html>
